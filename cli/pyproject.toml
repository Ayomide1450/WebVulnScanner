[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-cli"
version = "1.0.1"
description = "Glassbox command-line client - a security control plane for CI pipelines and terminals, speaking the /api/v1 HTTP surface only."
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]
keywords = ["security", "cli", "ci-cd", "appsec"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
]

[project.scripts]
glassbox = "wvs:cli"

[tool.setuptools]
py-modules = ["wvs"]
