name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No .env / real secrets needed - tests/conftest.py defaults every
        # env var config.py reads at import time (SECRET_KEY etc.) so the
        # suite is self-contained. See CLAUDE.md's "Tests" section.
        run: pytest -v
