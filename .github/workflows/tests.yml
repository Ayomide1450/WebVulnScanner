name: tests

# Manual-only: GitHub Actions free minutes are exhausted and the Actions
# spending budget is set to $0 (usage stopped), so this workflow must not
# fire automatically on push/PR - that would just fail/be blocked anyway.
# Run it on demand from the Actions tab ("Run workflow") or
# `gh workflow run tests.yml` when you want the suite to run in CI.
on:
  workflow_dispatch:

# Cancels a still-running run for the same branch/PR the moment a newer
# push arrives, instead of burning the full ~3-4 minute suite on a run
# that's already superseded - the common case when pushing several
# commits in quick succession during a session.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No .env / real secrets needed - tests/conftest.py defaults every
        # env var config.py reads at import time (SECRET_KEY etc.) so the
        # suite is self-contained. See CLAUDE.md's "Tests" section.
        run: pytest -v
