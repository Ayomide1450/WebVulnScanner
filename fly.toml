# fly.toml app configuration file generated for webvulnscanner on 2026-08-14T13:26:52+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'webvulnscanner'
primary_region = 'iad'

[build]
[env]
  FLASK_APP = 'app.py'
  SESSION_COOKIE_SECURE = 'true'
  TRUST_PROXY_HOPS = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
