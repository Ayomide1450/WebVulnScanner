{% extends "base.html" %}
{% block title %}Too many requests - WebVulnScanner{% endblock %}
{% block content %}
<div class="wrap" style="text-align:center; padding-top:80px;">
  <div class="card" style="max-width:480px; margin:0 auto; padding:40px 32px;">
    <svg class="icon" style="width:32px;height:32px;color:var(--medium);margin-bottom:12px;" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 3"/></svg>
    <h1 style="margin:0 0 8px; font-size:20px;">Too many requests</h1>
    <p style="color:var(--muted); font-size:13px; margin:0 0 22px;">You've hit a rate limit on this
    action. Wait a bit and try again.</p>
    <a class="btn primary" href="{{ url_for('scan.dashboard') if current_user.is_authenticated else url_for('public.index') }}">
      {{ 'Back to dashboard' if current_user.is_authenticated else 'Back home' }}
    </a>
  </div>
</div>
{% endblock %}
