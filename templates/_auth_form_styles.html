<!-- Shared form CSS for login/signup/forgot_password/reset_password/verify_email.
     Mirrors the _scan_form_styles.html / _admin_form_styles.html pattern - kept
     out of base.html because its unscoped label/input/button selectors would
     otherwise leak into every other form in the app. Previously this exact
     block was independently duplicated across all 5 templates; page-specific
     extras (.hint, .sub, .row-between/.remember-row/.forgot-link, a.back)
     stay inline in their own template. -->
<style>
  .auth-wrap { max-width: 420px; margin: 0 auto; padding: 40px 22px 80px; }
  .card { background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--border); border-radius: 16px; padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
  h1 { font-size: 26px; margin: 0 0 20px; letter-spacing: -0.01em; }
  label { display: block; margin-top: 18px; font-weight: 600; font-size: 13.5px; color: var(--text); }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 12px 40px 12px 14px; margin-top: 7px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 14.5px; background: rgba(255,255,255,.03); color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, input[type=email]:focus, input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
  .field-error { color: var(--critical); font-size: 12.5px; margin-top: 5px; }
  .pw-wrap { position: relative; }
  .pw-toggle { position:absolute; right:10px; top:50%; transform:translateY(-3px); background:none; border:none; cursor:pointer; color:var(--muted); padding:6px; margin:0; width:auto; display:flex; }
  .pw-toggle:hover { color: var(--text); opacity:1; }
  button {
    margin-top: 24px; width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border: none; padding: 14px 22px; border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; letter-spacing: .01em; transition: transform .1s, opacity .15s;
  }
  button:hover { opacity: .92; }
  button:active { transform: scale(.99); }
  button:disabled { opacity: .6; cursor: default; }
  .swap { margin-top: 18px; font-size: 13.5px; color: var(--muted); text-align: center; }
  .swap a { color: var(--accent); text-decoration: none; }
</style>
