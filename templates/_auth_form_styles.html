<!-- Shared form CSS for login/signup/forgot_password/reset_password/verify_email.
     Mirrors the _scan_form_styles.html / _admin_form_styles.html pattern - kept
     out of base.html because its unscoped label/input/button selectors would
     otherwise leak into every other form in the app. Previously this exact
     block was independently duplicated across all 5 templates; page-specific
     extras (.hint, .sub, .row-between/.remember-row/.forgot-link, a.back)
     stay inline in their own template.

     Phase 6 (DESIGN-01/03): consolidated onto base.html's canonical scale -
     no local .card override (base.html's canonical .card wins), solid
     accent button (not gradient), select/textarea added to the input rule
     pair. This is the tracer proof block copied into
     _scan_form_styles.html/_admin_form_styles.html. -->
<style>
  .auth-wrap { max-width: var(--container-auth); margin: 0 auto; padding: var(--space-7) 22px calc(var(--space-7) * 2); }
  h1 { margin: 0 0 20px; }
  label { display: block; margin-top: var(--space-4); font-weight: 600; font-size: 13px; color: var(--text); }
  input[type=text], input[type=email], input[type=password], select, textarea {
    width: 100%; padding: var(--space-3) var(--space-4); margin-top: var(--space-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: rgba(255,255,255,.03); color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, input[type=email]:focus, input[type=password]:focus, select:focus, textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,197,94,.18);
  }
  .field-error { color: var(--critical); font-size: 13px; margin-top: 5px; }
  .pw-wrap { position: relative; }
  .pw-toggle { position:absolute; right:10px; top:50%; transform:translateY(-3px); background:none; border:none; cursor:pointer; color:var(--muted); padding:6px; margin:0; width:auto; display:flex; }
  .pw-toggle:hover { color: var(--text); opacity:1; }
  button, .btn.block {
    margin-top: var(--space-6); width: 100%; background: var(--accent);
    color: #041007; border: none; padding: 14px 22px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
    cursor: pointer; letter-spacing: .01em; transition: transform .1s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active { transform: scale(.99); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .swap { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
  .swap a { color: var(--accent); text-decoration: none; }

  /* Phase 7 (RESP-02): this partial is included by exactly the five auth
     templates (login/signup/forgot_password/reset_password/verify_email)
     and nothing else, which is what makes the otherwise-unscoped .topnav
     selector below page-scoped in practice - it never reaches an
     authenticated page or the marketing page's topnav. 640px is
     deliberately the same threshold as base.html's existing topnav
     stack rule (see base.html's @media (max-width: 640px) { .topnav {...} })
     rather than a new breakpoint. The CTA suppression targets only
     a.cta-link so the topnav Login link and the brand link stay reachable -
     reset_password.html has no in-card counterpart link, so the topnav is
     its only navigation path and must not be hidden. */
  @media (max-width: 640px) {
    .auth-wrap { padding-top: var(--space-5); }
    .topnav .nav-links a.cta-link { display: none; }
  }
</style>
