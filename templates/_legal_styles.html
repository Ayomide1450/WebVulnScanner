<!-- Shared CSS for terms.html / privacy.html - was byte-identical inline
     <style> in both files.

     Phase 6 (DESIGN-01/02): retokenized onto base.html's canonical container/
     spacing scale - .legal-wrap consumes --container-form (760px, shared
     with the scan-launch wizard's comfortable reading measure) and the
     documented calc(var(--space-7) * 2) 96px page-bottom rhythm; h2 drops
     its local font-size override and cascades from base.html's new global
     h2 rule (20px). -->
<style>
  .legal-wrap { max-width: var(--container-form); margin: 0 auto; padding: var(--space-7) 22px calc(var(--space-7) * 2); }
  .legal-wrap h1 { margin-bottom: 4px; }
  .legal-wrap .updated { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .legal-wrap h2 { margin: 28px 0 8px; }
  .legal-wrap p, .legal-wrap li { color: var(--text); font-size: 15px; line-height: 1.65; }
  .legal-wrap ul { padding-left: 22px; margin: 8px 0; }
</style>
