<!-- Shared CSS for billing.html/org_admin.html/org_verify_domain.html's small
     admin-style forms (invite-member, add-domain, create-invoice, verify
     buttons) - extracted from three near-identical local <style> blocks.
     Not promoted into base.html, same reasoning _scan_form_styles.html's
     own header comment already documents: label/input[type=text]/
     input[type=email]/select/button are unscoped element selectors that
     would otherwise leak into every other form in the app (auth pages,
     the scan_new_* forms) - keeping this as an included partial scopes it
     to only the three pages that opt in.

     Phase 6 (DESIGN-01/03): consolidated onto base.html's canonical scale -
     input/select now carries a real :focus state (previously had none, a
     real accessibility gap) and the button is solid accent, not gradient,
     matching _auth_form_styles.html/_scan_form_styles.html's identical
     treatment. button's own top margin (--space-4, 16px) stays smaller than
     the other two partials' since these are compact inline admin-action
     buttons, not full-page primary submits. -->
<style>
  label { display: block; margin-top: var(--space-4); font-weight: 600; font-size: 13px; color: var(--text); }
  input[type=text], input[type=email], select, textarea {
    width: 100%; padding: var(--space-3) var(--space-4); margin-top: var(--space-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: rgba(255,255,255,.03);
    color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, input[type=email]:focus, select:focus, textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,197,94,.18);
  }
  /* The closed <select> control itself already inherits the dark theme via
     the rule above plus base.html's `color-scheme: dark` - but Chromium's
     native open-dropdown popup does NOT reliably dark-theme its <option>
     rows from `color-scheme` alone (confirmed live on billing.html's "Pay
     with" USDT/USDC select, Phase 10 live-verification sweep, 08-20): the
     non-hovered option rendered with a native white background and
     near-unreadable light-gray text. Options need their own explicit
     solid background/color - translucent rgba() (the select's own
     background) doesn't work here since the popup is a separate rendering
     layer, not composited over the page. */
  select option { background-color: var(--panel); color: var(--text); }
  button, .btn.block {
    margin-top: var(--space-4); width: 100%; background: var(--accent);
    color: #041007; border: none; padding: 14px 22px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: filter 150ms ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .verify-btn { margin-top: 0; padding: 6px 12px; font-size: 13px; }
  .field-error { color: var(--critical); font-size: 13px; margin-top: 5px; }
</style>
