# Lint / type-check configuration.
#
# Added 2026-10-25 - this repo had no linter, formatter or type checker at
# all before that, on 14.5k lines of security-sensitive Python.
#
# IMPORTANT: this gate runs LOCALLY, not in CI. GitHub Actions minutes are
# exhausted and the spending budget is $0, so .github/workflows/tests.yml is
# workflow_dispatch-only - a lint job wired only into CI would never fire and
# would be pure decoration. Run it by hand before committing:
#
#     .venv/Scripts/python -m ruff check glassbox/ tests/ scripts/ app.py
#     .venv/Scripts/python -m ruff format --check glassbox/ app.py
#
# The selected rule set is deliberately strict on `glassbox/` (the shipped
# package) and pragmatic on `tests/` and `scripts/`, where several rules are
# actively wrong - a test suite is *supposed* to be full of asserts and
# fixture passwords.

[tool.ruff]
line-length = 100
target-version = "py312"   # matches CI's pinned interpreter, not the local 3.14 venv
extend-exclude = [".venv", "migrations", "graphify-out", ".planning"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes - real bugs: undefined names, unused imports
    "W",    # pycodestyle warnings
    "I",    # isort - deterministic import order
    "B",    # flake8-bugbear - likely-wrong constructs
    "S",    # flake8-bandit - security lint, the point of the exercise here
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]
ignore = [
    # 1,547 violations against an established house style that deliberately
    # runs long prose comments. Reflowing 14.5k lines would bury every real
    # finding in whitespace churn and wreck `git blame` on a security
    # codebase. line-length above still documents the intent.
    "E501",
    # The codebase's checks all swallow exceptions on purpose so one failing
    # check cannot kill a whole scan - that convention is documented in
    # CLAUDE.md and enforced by tests. Flagging it here would be noise.
    "S110",  # try-except-pass
    "S112",  # try-except-continue
    # `assert` is how the test suite works; also used for internal
    # invariants. Narrowed per-file below rather than blanket-allowed.
    "SIM105",
    # Mid-file / function-local imports are load-bearing here, not sloppiness:
    # the Flask app factory and several blueprints import models and each
    # other lazily specifically to break circular imports (see
    # scan_engine.py:21, admin_routes.py:38, org_routes.py:86). Hoisting them
    # to the top would reintroduce the cycle. Enforcing this rule would mean
    # ~7 permanent noqa comments on lines whose placement is already the
    # documented design.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# A test suite is supposed to be asserts and fake credentials.
"tests/*" = [
    "S101",  # assert - the entire point of a test
    "S105", "S106", "S107",  # "hardcoded password" = fixture passwords
    "S311",  # non-cryptographic random in test data
    "E402",  # tests/test_auth_flows.py imports mid-file by design
    "B017",  # assertRaises(Exception) in a few deliberate smoke tests
    # Style-only rules, suppressed rather than applied to test code. Test
    # bodies optimise for being obvious when one fails, which is not always
    # the most compact form: a nested `with` or `if` often reads as the
    # setup/assertion steps it represents. Rewriting them buys nothing a
    # reader of a failing test cares about.
    "SIM102",  # collapsible-if (incl. the AST walkers in the lock tests)
    "SIM117",  # nested with - usually one context per mocked dependency
    "E741",    # `l` as a loop var in one NDJSON line-parsing test
    "E731",    # a one-line lambda stub in test_phase20_checks
    "B905",    # zip() without strict= over two known-equal-length lists
    # test_seo.py parses the app's OWN sitemap.xml output. defusedxml is the
    # right call for untrusted input; this input is a fixture the test just
    # generated, and swapping it would add a dependency to assert on our own
    # bytes.
    "S314",
    # "0.0.0.0" in test_ssrf_guard.py is a parametrised address asserting the
    # SSRF guard *rejects* it - the opposite of binding to it.
    "S104",
]
# Operational scripts: one-shot local tooling, run by hand against this app's
# own local instance, never shipped in the deployed package.
"scripts/*" = [
    "S101",
    "S603", "S607",  # subprocess calls with known-local commands
    "S311",
    # Disposable credentials for the throwaway probe database that
    # live_probe_phase8.py seeds in the OS temp dir - and a "token_symbol"
    # that is a crypto ticker, not a secret.
    "S105", "S106",
    # The dev-server bind address in a local-only helper.
    "S104",
]
# The scanner legitimately parses hostile XML from scanned targets; the
# relevant guard is upstream (defusedxml-style handling / size limits), not
# a blanket ban on ElementTree.
"glassbox/checks.py" = ["S314"]

[tool.ruff.lint.isort]
known-first-party = ["glassbox"]

[tool.ruff.format]
# Not enabled as a gate yet: formatting 14.5k lines in one commit would make
# the security review of this pass impossible to read. Config is here so a
# future pass can adopt it file-by-file.
quote-style = "preserve"

[tool.mypy]
# Deliberately NOT strict. The codebase has 317 annotated functions but only
# 44 return annotations, so --strict would emit thousands of errors and get
# switched off within a week. This configuration is the honest starting
# point: catch real type contradictions now, tighten per-module later.
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
ignore_missing_imports = true   # weasyprint/python3-saml/etc. ship no stubs
exclude = ["\\.venv", "migrations", "graphify-out", "tests"]

# `class Organization(db.Model)` x18. flask_sqlalchemy DOES ship py.typed, so
# this is not a missing-stub problem: `db = SQLAlchemy()` is an *instance*, so
# `db.Model` is an instance attribute, and mypy requires a base class to be a
# resolvable type name rather than an attribute expression. A long-standing,
# documented limitation of the classic Flask-SQLAlchemy pattern - not a defect
# in models.py.
#
# The real fix is Flask-SQLAlchemy 3.1's typed declarative style
# (`class Base(DeclarativeBase)` + `SQLAlchemy(model_class=Base)`, with
# `db.Column` -> `mapped_column`). That rewrites the schema layer for all 18
# models while Alembic migrations are live, so it belongs in its own change
# with its own verification, not bundled into a lint pass.
[[tool.mypy.overrides]]
module = "glassbox.models"
disable_error_code = ["name-defined"]
